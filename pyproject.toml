[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "container-ctl"
version = "0.2.0"
description = "Container lifecycle, Quadlet orchestration, and isolated execution toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "onestepfromhell-hashbrowns" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
scan = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "jsonschema>=4.0", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/onestepfromhell-hashbrowns/container-ctl"
Repository = "https://github.com/onestepfromhell-hashbrowns/container-ctl"
Issues = "https://github.com/onestepfromhell-hashbrowns/container-ctl/issues"
Security = "https://github.com/onestepfromhell-hashbrowns/container-ctl/security/advisories/new"

[project.scripts]
container-ctl = "container_ctl.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["container_ctl*", "container_control*", "container_params*", "broker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
